<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <rect width="640" height="300" rx="10" fill="#ffffff" stroke="#d0d7de"/>
  <text x="320" y="30" text-anchor="middle" font-size="16" font-weight="600" fill="#1f2328">Input tokens per session (Claude Code, Haiku, claude -p)</text>
  <line x1="150" y1="60" x2="150" y2="250" stroke="#8c959f"/>
  <text x="140" y="108" text-anchor="end" font-size="14" fill="#1f2328">Without FSR</text>
  <rect x="150" y="80" width="440" height="42" rx="3" fill="#cf222e"/>
  <text x="582" y="107" text-anchor="end" font-size="15" font-weight="600" fill="#ffffff">46.2k</text>
  <text x="140" y="188" text-anchor="end" font-size="14" fill="#1f2328">With FSR</text>
  <rect x="150" y="160" width="356" height="42" rx="3" fill="#1a7f37"/>
  <text x="498" y="187" text-anchor="end" font-size="15" font-weight="600" fill="#ffffff">37.4k</text>
  <rect x="506" y="160" width="84" height="42" rx="3" fill="none" stroke="#1a7f37" stroke-dasharray="5 4"/>
  <text x="548" y="186" text-anchor="middle" font-size="13" font-weight="600" fill="#1a7f37">-8.8k</text>
  <text x="320" y="240" text-anchor="middle" font-size="14" font-weight="600" fill="#1a7f37">19% fewer tokens before the first prompt is even typed</text>
  <text x="320" y="278" text-anchor="middle" font-size="11" fill="#57606a">Single measured run; the agent listing shrinks to built-in agents, the relevant ones are injected on demand.</text>
</svg>
