[build-system]
requires = ["setuptools==80.10.2"]
build-backend = "setuptools.build_meta"

[project]
name = "fastskillretrieval"
version = "0.3.0"
description = "Versioned local capability retrieval and deterministic planning, with a stdio MCP adapter"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
    "mcp==1.29.0",
    "pyyaml==6.0.3",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "build==1.4.0", "ruff==0.15.0", "coverage==7.13.3", "jsonschema==4.26.0"]

[project.scripts]
fastskillretrieval = "fastskillretrieval.cli:main"
fastskillretrieval-experiment = "fastskillretrieval.experiment_cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py313"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B"]

[tool.coverage.run]
source = ["fastskillretrieval"]

[tool.coverage.report]
show_missing = true
